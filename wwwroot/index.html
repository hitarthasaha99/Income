    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />

    <link rel="icon" href="data:,">

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Safety fallback -->
    <script>
        window.blazorBootstrap = window.blazorBootstrap || {};
    </script>

    <!-- 1. Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Sortable (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- 3. BlazorBootstrap -->
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>

    <!-- 4. Blazor WebView (ONLY ONCE) -->
    <script src="scripts/blazor.webview.es2019.js" autostart="false"></script>

    <!-- 5. Delayed start (CRITICAL for Android 10) -->
    <script>
        window.addEventListener('load', function () {
            setTimeout(() => {
                Blazor.start();
            }, 100);
        });
    </script>

    <!--Model class Close after save-->
    <script>
        window.closeModal = function (id) {
            var modal = bootstrap.Modal.getInstance(document.getElementById(id));
            if (modal) modal.hide();
        }

        // All Remarks field Regex

        function validateRemarks(e) {
            const el = e.target;
            let value = el.value;

            // If first character is NOT alphanumeric → remove it (typing + paste)
            if (value.length > 0 && !/^[a-zA-Z0-9]/.test(value)) {
                el.value = value.replace(/^[^a-zA-Z0-9]+/, '');
            }
        }


        //All Text Field Regex
        function validateText(e, v) {
            return !e.data
                || /^[A-Za-z]$/.test(e.data)
                || (v.length > 0 && e.data === ' ');
        }

    </script>

</body>

</html>
